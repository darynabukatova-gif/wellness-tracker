# Runs the real Electron UI suite for pull requests targeting main and on demand.
# It remains separate from the fast Node.js workflow.

name: Wellness Tracker Electron E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  electron-e2e:
    name: Run Electron E2E tests (Node.js 24)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron E2E tests with Xvfb
        run: xvfb-run -a npm run test:e2e
